name: Source validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install renderer and packaging dependencies
        run: python -m pip install -r code/requirements.txt
      - name: Unit and scorer/input mutation checks
        run: python -m unittest discover -s code -p 'test_*.py' -v
      - name: Require Arabic shaping support
        run: python -c "from PIL import features; assert features.check('raqm'), 'Pillow RAQM is required'"
      - name: Render bounded 24-layout pilot
        run: python code/build.py --pilot --output work/pilot --workers 2
      - name: Independently validate visible text, boxes, gold and splits
        run: python code/validate_release.py --release work/pilot --report work/pilot/validation-report.json
